name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - run: python -m pip install ruff==0.14.0
      - name: Lint (ruff.toml)
        run: ruff check .
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: adapters/client/requirements-control-plane.txt
      - run: python -m pip install -r adapters/client/requirements-control-plane.txt
      - name: Client tests
        run: python tools/run_tests.py unittest discover -s tests -p "test_*.py"
  launcher:
    # The launcher supports Node.js 18 and newer (package.json `engines`): 18 and the long-term
    # releases 22 and 24 on Linux, and 22 on the two systems the package installs on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "22", "24"]
        include:
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Launcher tests
        run: node --test
        working-directory: packages/command-line
